name: "app:test:e2e full-stack against a real database"

on: push

jobs:
  # only (but most important) job from this workflow required for pull requests
  # check results serve as run conditions for all other jobs here
  files-changed:
    name: Detect File Changes - app-test-e2e-code
    runs-on: ubuntu-latest
    outputs:
      changes: ${{ steps.changes.outputs.filter }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7

      - name: Check for relevant file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ${{ github.token }}
          filters: |
            filter:
              - 'app/**/*'
              - 'database/**/*'
              - 'docker-compose.e2e.yml'
              - '.github/workflows/*'
          list-files: shell

  e2e:
    if: needs.files-changed.outputs.changes == 'true'
    name: E2E - App
    needs: files-changed
    runs-on: ubuntu-latest
    env:
      WORKING_DIRECTORY: ./app
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.1.7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: app/.tool-versions

      # The suite reads .env.e2e, but the build step also wants a plain .env.
      - name: Env File
        run: cp .env.template .env
        working-directory: ${{env.WORKING_DIRECTORY}}

      # MariaDB with the extracted osCommerce schema, plus maildev. The seed runs
      # from Playwright's globalSetup, so the stack only has to be healthy here.
      - name: Start backend stack
        run: docker compose -f docker-compose.e2e.yml up -d --wait

      - name: Install dependencies
        run: npm ci
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: App | E2E
        run: npm run test:e2e
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: app/playwright-report/
          retention-days: 30

      - name: Stop backend stack
        if: always()
        run: docker compose -f docker-compose.e2e.yml down -v
